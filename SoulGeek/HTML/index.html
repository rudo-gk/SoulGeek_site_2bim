<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoulGeek | Social Media de Filmes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-dark bg-dark px-4 py-3">
            <div class="container-fluid">
                <!-- ESQUERDA -->
                <div class="d-flex align-items-center gap-3">
                    <!-- MENU -->
                    <button class="btn text-light">
                        <i class="bi bi-list fs-2"></i>
                    </button>
                    <!-- LOGO -->
                    <h1 class="text-light fs-3 m-0">SoulGeek</h1>
                </div>
                <!-- DIREITA -->
                <div class="d-flex align-items-center gap-3">
                    <!-- LOGIN -->
                    <button class="btn btn-outline-light">Login</button>
                    <!-- CADASTRO -->
                    <button class="btn btn-success text-nowrap">Criar Conta</button>
                    <!-- BUSCA -->
                    <div class="input-group">
                    <input type="text" class="form-control" placeholder="Buscar filmes ou séries"/>
                    <button class="btn btn-success">
                        <i class="bi bi-search"></i>
                    </button>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section id="hero"></section>
    
    
        <section id="movies"></section>

        <section id="series"></section>

        <section id="about"></section>

        <section id="reviews"></section>

    </main>

    <footer>

    </footer>
</body>
</html>
