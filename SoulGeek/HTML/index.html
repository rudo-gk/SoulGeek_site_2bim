<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoulGeek</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">


    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">


    <link rel="stylesheet" href="../Assets/Css/style.css">
</head>

<body>
    
    <header>
        <nav class="navbar navbar-dark bg-dark px-4 py-3">
            <div class="container-fluid">
                <div class="d-flex align-items-center gap-3">
                    <div id="menu-container">
                        <button class="btn text-light" id="hamburger"><i class="bi bi-list fs-2"></i></button>
                        <div id="sidebar">
                            <a href="#" class="d-block text-decoration-none py-2">Filmes</a>
                            <a href="#" class="d-block text-decoration-none py-2">Séries</a>
                            <a href="#" class="d-block text-decoration-none py-2">Reviews</a>
                            <a href="#" class="d-block text-decoration-none py-2">Sobre</a>
                        </div>
                    </div>
                    <h1 class="text-light fs-3 m-0">SoulGeek</h1>
                </div>

                <div class="d-flex align-items-center gap-3">
                    <button class="btn btn-outline-light">Login</button>
                    <button class="btn btn-success text-nowrap">Criar Conta</button>
                    <div class="input-group">
                        <input type="text" class="form-control" placeholder="Buscar filmes ou séries"/>
                        <button class="btn btn-success"><i class="bi bi-search"></i></button>
                    </div>
                </div>
            </div>
        </nav>
    </header>
    
    <main>
        <section id="carouselFilmes" class="carousel slide">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="../Assets/img/como eu era antes vc.jpg">
                </div>
                <div class="carousel-item">
                    <img src="../Assets/img/homem aranha.jpg">
                </div>
                <div class="carousel-item">
                    <img src="../Assets/img/lala land.jpg">
                </div>
                <div class="carousel-item">
                    <img src="../Assets/img/o-diabo-veste-prada-2.webp">
                </div>
                <div class="carousel-item">
                    <img src="../Assets/img/panico.jpg">
                </div>
            </div>
        </section>

        </section>

        <section id="movies">

        </section>

        <section id="series">

        </section>

        <section id="about">

        </section>

        <section id="reviews">

        </section>

    </main>
    <!-- SIDEBAR -->
    

    

    <footer>

    </footer>


    <script>
        function abrirMenu(){
            const sidebar =
            document.getElementById("sidebar");
            sidebar.style.left = "0";
        }

        function fecharMenu(){
            const sidebar =
            document.getElementById("sidebar");
            sidebar.style.left = "-200px";
        }
    </script>

</body>
</html>
